<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>スタンプ帳 - きらりフェスタQUEST</title>
  <link rel="stylesheet" href="assets/css/style.css">
  <style>
    .stamp-grid {
      display: grid;
      grid-template-columns: repeat(5, 1fr);
      gap: 10px;
      margin: 20px 0;
    }
    .stamp-slot {
      aspect-ratio: 1;
      border: 2px dashed #ffb74d;
      background: #fff;
      border-radius: 50%;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      font-size: 0.7rem;
      font-weight: bold;
      color: #ffa726;
      position: relative;
    }
    .stamp-slot.filled {
      border: 2px solid #4caf50;
      background: #e8f5e9;
      color: #2e7d32;
    }
    .stamp-mark {
      font-size: 1.5rem;
      line-height: 1;
    }
  </style>
</head>
<body>
  <div class="container">
    <h2>きらりスタンプ帳</h2>
    
    <div class="card" style="text-align: center; background: #fffde7; border: 2px solid #fff59d;">
      <p style="font-size: 1.1rem; margin: 0;">現在のクリア数: <strong id="count-display" style="font-size: 1.8rem; color: #e65100;">0</strong> / 10</p>
      <p style="font-size: 1.1rem; margin: 8px 0 0 0;">あなたの称号:<br><strong id="title-display" style="color: #03a9f4; font-size: 1.3rem;">QUEST参加前</strong></p>
    </div>

    <div class="stamp-grid" id="stamp-grid-container"></div>

    <div id="certificate-section" style="display: none; margin: 24px 0; padding: 20px; border: 4px double #ffd700; border-radius: 12px; background: #ffffff; text-align: center; box-shadow: 0 4px 10px rgba(0,0,0,0.05);">
      <h3 style="color: #b78103; margin: 0 0 10px 0; font-size: 1.4rem;">🏆 デジタル認定証 🏆</h3>
      <p style="font-size: 0.9rem; color: #555; margin-bottom: 15px;">かまがや市民活動・男女きらりフェスタ2026</p>
      <p style="font-size: 1.05rem; line-height: 1.8; text-align: left; padding: 0 10px;">
        あなたは、出展ブースをめぐり、地域の活動を楽しく学びました。<br>
        ここに「<strong id="cert-title" style="color: #e65100; font-size: 1.1rem;"></strong>」として活躍したことを認定します。
      </p>
      <p style="font-size: 0.8rem; color: #777; margin-top: 15px; background: #f9f9f9; padding: 6px; border-radius: 4px;">
        🎁 景品交換対象の方は、この画面のまま本部スタッフに見せてください。<br>
        （スクリーンショットで保存しておくこともおすすめです）
      </p>
    </div>

    <div id="next-goal-msg" style="text-align: center; margin-bottom: 20px; font-weight: bold; color: #666; font-size: 0.95rem;"></div>

    <a href="missions.html" class="btn">ミッション一覧に戻る</a>
    <a href="index.html" class="btn btn-sub">トップへ戻る</a>
    
    <button onclick="resetData()" style="width: 100%; padding: 10px; margin-top: 40px; background: #eeeeee; border: 1px solid #ccc; border-radius: 6px; color: #666; font-size: 0.85rem; cursor: pointer;">クリア状況を最初からリセットする</button>
  </div>

  <script src="assets/js/missions.js"></script>
  <script src="assets/js/app.js"></script>
  <script>
    const completed = getCompletedMissions();
    const count = completed.length;
    const currentTitle = getTitle(count);

    document.getElementById('count-display').innerText = count;
    document.getElementById('title-display').innerText = currentTitle;

    // スタンプマスの動的生成
    const gridContainer = document.getElementById('stamp-grid-container');
    missions.forEach((mission, index) => {
      const isDone = completed.includes(mission.id);
      const slot = document.createElement('div');
      slot.className = `stamp-slot ${isDone ? 'filled' : ''}`;
      
      if (isDone) {
        slot.innerHTML = `<span class="stamp-mark">💮</span><span style="font-size:0.55rem;">${mission.boothNo}</span>`;
      } else {
        slot.innerHTML = `<span style="font-size:0.9rem;color:#ccc;">${index + 1}</span><span style="font-size:0.55rem;color:#aaa;">${mission.boothNo}</span>`;
      }
      gridContainer.appendChild(slot);
    });

    // 次の目標案内
    const goalMsg = document.getElementById('next-goal-msg');
    if (count < 1) {
      goalMsg.innerText = "まずはミッションを1つクリアしてみよう！";
    } else if (count < 3) {
      goalMsg.innerText = `あと ${3 - count} 個クリアで「きらりチャレンジャー」に昇格！`;
    } else if (count < 5) {
      goalMsg.innerText = `あと ${5 - count} 個クリアで「地域つながり隊」に昇格＆認定証ゲット！`;
    } else if (count < 8) {
      goalMsg.innerText = `あと ${8 - count} 個クリアで「きらりマスター」に昇格！`;
    } else if (count < 10) {
      goalMsg.innerText = `あと ${10 - count} 個クリアで「カマフェスタ冒険王」に昇格！`;
    } else {
      goalMsg.innerText = "🎉 全ミッション完全制覇！おめでとうございます！";
    }

    // 5個以上で認定証表示
    if (count >= 5) {
      document.getElementById('certificate-section').style.display = 'block';
      document.getElementById('cert-title').innerText = currentTitle;
    }
  </script>
</body>
</html>
